<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cysterka</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #14301a;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { display: block; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
  h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 4px;
    text-shadow: 0 3px 0 #7f0000, 0 5px 8px rgba(0,0,0,0.5);
  }
  .scores { display: flex; gap: 28px; font-size: 16px; font-weight: bold; }
  canvas {
    border: 3px solid #0b1d0f;
    border-radius: 8px;
    width: min(94vw, 56vh, 528px);
    height: min(94vw, 56vh, 528px);
  }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 12px; }
  .chip { padding: 3px 8px; border-radius: 10px; font-weight: bold; color: #fff; border: 1.5px solid #fff; }
  .hint { font-size: 12px; color: #9fc4a4; text-align: center; padding: 0 10px; }
  .modes { display: flex; gap: 10px; width: min(94vw, 528px); }
  .mode {
    flex: 1;
    padding: 8px 6px;
    border: 2px solid #3f6b45;
    border-radius: 10px;
    background: #1d3f24;
    color: #cfe8d2;
    font-family: inherit;
    font-weight: 900;
    font-size: 15px;
    letter-spacing: 1px;
    line-height: 1.2;
    cursor: pointer;
  }
  .mode small { display: block; font-weight: normal; font-size: 11px; letter-spacing: 0; opacity: 0.9; margin-top: 2px; }
  .mode.active { background: #c62828; border-color: #fff; color: #fff; }
</style>
</head>
<body>
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" width="54" height="54" aria-hidden="true">
      <rect x="2" y="2" width="60" height="60" rx="14" fill="#c62828"/>
      <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M32 6c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z" fill="#fff"/>
      <rect x="9" y="30" width="32" height="17" rx="8.5" fill="#eceff1"/>
      <rect x="23" y="30" width="4" height="17" fill="#ef6c00"/>
      <path d="M43 33h8l5 6v8H43z" fill="#263238"/>
      <path d="M46 35h4l3 4h-7z" fill="#b3e5fc"/>
      <circle cx="19" cy="48" r="4.5" fill="#111" stroke="#fff" stroke-width="1.5"/>
      <circle cx="33" cy="48" r="4.5" fill="#111" stroke="#fff" stroke-width="1.5"/>
      <circle cx="49" cy="48" r="4.5" fill="#111" stroke="#fff" stroke-width="1.5"/>
    </svg>
    <h1>CYSTERKA</h1>
  </div>
  <div class="scores">
    <div>Wynik: <span id="score">0</span></div>
    <div>Rekord: <span id="best">0</span></div>
  </div>
  <canvas id="game" width="528" height="528"></canvas>
  <div class="legend">
    <span class="chip" style="background:#2e9d3a">PB95 +1</span>
    <span class="chip" style="background:#e08a00">PB98 +2</span>
    <span class="chip" style="background:#222">ON +1</span>
    <span class="chip" style="background:#1565c0">ON+ +3</span>
  </div>
  <div class="hint">Strzałki / WASD / przesunięcie palcem · Spacja lub dotyk = start / pauza</div>
  <div class="modes">
    <button type="button" class="mode" id="m-cienias">CIENIAS<small>przez ściany, wracasz z drugiej strony</small></button>
    <button type="button" class="mode" id="m-pro">PRO<small>ściany = BOOOM</small></button>
  </div>

<script>
(function () {
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");

  var N = 20;                 // pola drogi N x N
  var CELL = 24;
  var M = 24;                 // margines z trawą
  var SIZE = N * CELL + 2 * M;

  var FUELS = [
    { label: "95",  color: "#2e9d3a", pts: 1, w: 4 },
    { label: "98",  color: "#e08a00", pts: 2, w: 2 },
    { label: "ON",  color: "#222222", pts: 1, w: 4 },
    { label: "ON+", color: "#1565c0", pts: 3, w: 1 }
  ];

  var snake, dir, queue, food, score, best, state, timer;
  // state: "ready" | "running" | "paused" | "over"

  var mode = "pro";   // "pro" albo "cienias"
  try {
    var savedMode = localStorage.getItem("cysterna-mode");
    if (savedMode === "cienias" || savedMode === "pro") mode = savedMode;
  } catch (e) {}

  function loadBest() {
    best = 0;
    try { best = parseInt(localStorage.getItem("cysterna-best-" + mode), 10) || 0; } catch (e) {}
    bestEl.textContent = best;
  }
  loadBest();

  // ---------- pomocnicze rysowanie ----------
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function circle(g, x, y, r) {
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }

  // ---------- tło: droga + zieleń (rysowane raz) ----------
  var bg = document.createElement("canvas");
  bg.width = bg.height = SIZE;
  (function () {
    var g = bg.getContext("2d");
    var seed = 7;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    var i;

    // trawa
    g.fillStyle = "#3e8e41";
    g.fillRect(0, 0, SIZE, SIZE);
    for (i = 0; i < 450; i++) {
      g.fillStyle = rnd() < 0.5 ? "#47994a" : "#37803a";
      g.fillRect(rnd() * SIZE, rnd() * SIZE, 3, 3);
    }

    // droga
    var R = N * CELL;
    g.fillStyle = "#3b3b3d";
    g.fillRect(M, M, R, R);
    for (i = 0; i < 350; i++) {
      g.fillStyle = rnd() < 0.5 ? "#454547" : "#333335";
      g.fillRect(M + rnd() * R, M + rnd() * R, 2, 2);
    }

    // linie przy krawędzi i przerywane pasy
    g.strokeStyle = "#f5f5f5";
    g.lineWidth = 2;
    g.strokeRect(M + 3, M + 3, R - 6, R - 6);
    g.setLineDash([12, 12]);
    g.strokeStyle = "rgba(255,255,255,0.55)";
    g.beginPath();
    g.moveTo(M + R / 2, M + 6); g.lineTo(M + R / 2, M + R - 6);
    g.moveTo(M + 6, M + R / 2); g.lineTo(M + R - 6, M + R / 2);
    g.stroke();
    g.setLineDash([]);

    // drzewa wokół drogi
    function tree(x, y, r) {
      g.fillStyle = "rgba(0,0,0,0.25)";
      circle(g, x + 2, y + 3, r);
      g.fillStyle = "#1f5c25";
      circle(g, x, y, r);
      g.fillStyle = "#2f7d32";
      circle(g, x - r * 0.25, y - r * 0.25, r * 0.62);
    }
    for (i = 0; i < N + 2; i++) {
      var p = M / 2 + i * CELL;
      if (i % 2 === 0) {
        tree(p, M / 2 + (rnd() - 0.5) * 4, 8 + rnd() * 3);
        tree(p, SIZE - M / 2 + (rnd() - 0.5) * 4, 8 + rnd() * 3);
      } else {
        tree(M / 2 + (rnd() - 0.5) * 4, p, 8 + rnd() * 3);
        tree(SIZE - M / 2 + (rnd() - 0.5) * 4, p, 8 + rnd() * 3);
      }
    }
  })();

  // ---------- logika ----------
  function pickFuel() {
    var total = 0, i;
    for (i = 0; i < FUELS.length; i++) total += FUELS[i].w;
    var r = Math.random() * total;
    for (i = 0; i < FUELS.length; i++) {
      r -= FUELS[i].w;
      if (r < 0) return FUELS[i];
    }
    return FUELS[0];
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    scoreEl.textContent = score;
    placeFood();
    crash = null;
    particles = [];
    state = "ready";
    draw();
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < N; x++) {
      for (var y = 0; y < N; y++) {
        if (!snake.some(function (s) { return s.x === x && s.y === y; })) {
          free.push({ x: x, y: y });
        }
      }
    }
    if (!free.length) { food = null; return; }
    var c = free[Math.floor(Math.random() * free.length)];
    var f = pickFuel();
    food = { x: c.x, y: c.y, label: f.label, color: f.color, pts: f.pts };
  }

  function speed() { return Math.max(70, 130 - score * 2); }

  function loop() {
    step();
    draw();
    if (state === "running") timer = setTimeout(loop, speed());
  }

  function start() {
    if (state === "over") reset();
    if (state === "ready" || state === "paused") {
      state = "running";
      clearTimeout(timer);
      timer = setTimeout(loop, speed());
    }
    draw();
  }

  function pause() {
    if (state === "running") {
      state = "paused";
      clearTimeout(timer);
      draw();
    }
  }

  function step() {
    if (queue.length) dir = queue.shift();
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    var hitWall = false;
    if (mode === "cienias") {
      // przejazd przez ścianę – wracasz z drugiej strony
      head.x = (head.x + N) % N;
      head.y = (head.y + N) % N;
    } else {
      hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
    }
    var hitSelf = snake.some(function (s, i) {
      return i < snake.length - 1 && s.x === head.x && s.y === head.y;
    });
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);
    if (food && head.x === food.x && head.y === food.y) {
      score += food.pts;
      scoreEl.textContent = score;
      // cysterna rośnie o tyle członów, ile punktów
      for (var k = 1; k < food.pts; k++) snake.push({ x: snake[snake.length - 1].x, y: snake[snake.length - 1].y });
      placeFood();
    } else {
      snake.pop();
    }
    if (!food) gameOver();
  }

  var crash = null, particles = [], crashStart = 0, lastTs = 0;

  function gameOver() {
    clearTimeout(timer);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("cysterna-best-" + mode, best); } catch (e) {}
    }
    startCrash();
  }

  // ---------- kolizja: wybuch + BOOOM ----------
  function startCrash() {
    var h = snake[0];
    crash = {
      x: M + h.x * CELL + CELL / 2 + dir.x * CELL * 0.6,
      y: M + h.y * CELL + CELL / 2 + dir.y * CELL * 0.6
    };
    if (mode === "cienias") {
      // w trybie CIENIAS zderzenie jest zawsze z własną naczepą, więc wybuch w tym polu
      var hx = (h.x + dir.x + N) % N, hy = (h.y + dir.y + N) % N;
      crash = { x: M + hx * CELL + CELL / 2, y: M + hy * CELL + CELL / 2 };
    }
    particles = [];
    var i, a, sp;
    for (i = 0; i < 46; i++) {
      a = Math.random() * Math.PI * 2;
      sp = 1 + Math.random() * 4.5;
      particles.push({ x: crash.x, y: crash.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                       life: 0, max: 500 + Math.random() * 500, size: 2 + Math.random() * 3, kind: "spark" });
    }
    for (i = 0; i < 14; i++) {
      a = Math.random() * Math.PI * 2;
      sp = 0.3 + Math.random() * 1.2;
      particles.push({ x: crash.x, y: crash.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.3,
                       life: 0, max: 900 + Math.random() * 600, size: 8 + Math.random() * 8, kind: "smoke" });
    }
    state = "crashing";
    crashStart = 0;
    lastTs = 0;
    requestAnimationFrame(crashFrame);
  }

  function drawBoom(scale) {
    ctx.save();
    ctx.translate(SIZE / 2, SIZE / 2 - 50);
    ctx.scale(scale, scale);
    ctx.rotate(-0.08);
    ctx.font = "900 48px 'Arial Black', Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = 9;
    ctx.strokeStyle = "#3e1200";
    ctx.strokeText("BOOOM!", 0, 0);
    var g = ctx.createLinearGradient(0, -24, 0, 24);
    g.addColorStop(0, "#fff176");
    g.addColorStop(1, "#ff6f00");
    ctx.fillStyle = g;
    ctx.fillText("BOOOM!", 0, 0);
    ctx.restore();
  }

  function crashFrame(ts) {
    if (state !== "crashing") return;
    if (!crashStart) { crashStart = ts; lastTs = ts; }
    var t = ts - crashStart;
    var dt = Math.min(40, ts - lastTs);
    lastTs = ts;

    ctx.save();
    if (t < 600) {
      var k = (1 - t / 600) * 5;
      ctx.translate((Math.random() - 0.5) * k * 2, (Math.random() - 0.5) * k * 2);
    }
    drawScene();

    // kula ognia
    var r = Math.min(1, t / 450);
    var rad = 8 + 44 * (1 - Math.pow(1 - r, 3));
    var fade = t < 900 ? 1 : Math.max(0, 1 - (t - 900) / 700);
    ctx.globalAlpha = fade;
    var grd = ctx.createRadialGradient(crash.x, crash.y, 2, crash.x, crash.y, rad);
    grd.addColorStop(0, "#fffde7");
    grd.addColorStop(0.35, "#ffeb3b");
    grd.addColorStop(0.7, "#ff9800");
    grd.addColorStop(1, "rgba(211,47,47,0)");
    ctx.fillStyle = grd;
    circle(ctx, crash.x, crash.y, rad);
    ctx.globalAlpha = 1;

    // błysk
    if (t < 140) {
      ctx.fillStyle = "rgba(255,255,255," + (0.6 * (1 - t / 140)) + ")";
      ctx.fillRect(0, 0, SIZE, SIZE);
    }

    // iskry i dym
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.life += dt;
      if (p.life > p.max) continue;
      p.x += p.vx;
      p.y += p.vy;
      var al = 1 - p.life / p.max;
      if (p.kind === "spark") {
        p.vy += 0.04;
        ctx.globalAlpha = al;
        ctx.fillStyle = p.life < p.max * 0.4 ? "#ffd54f" : "#ff7043";
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = "rgba(60,60,60," + (0.5 * al) + ")";
        circle(ctx, p.x, p.y, p.size * (1 + (p.life / p.max) * 1.5));
      }
    }

    // napis BOOOM!
    if (t > 60) {
      var u = t - 60;
      var sc = u < 200 ? 0.3 + (u / 200) * 1.0 : u < 350 ? 1.3 - ((u - 200) / 150) * 0.3 : 1;
      drawBoom(sc);
    }
    ctx.restore();

    if (t < 1700) {
      requestAnimationFrame(crashFrame);
    } else {
      state = "over";
      draw();
    }
  }

  function drawScorch() {
    if (!crash) return;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    circle(ctx, crash.x, crash.y, 18);
    ctx.fillStyle = "#ff7043";
    circle(ctx, crash.x - 5, crash.y + 3, 2);
    circle(ctx, crash.x + 6, crash.y - 4, 1.5);
  }

  function turn(nx, ny) {
    var last = queue.length ? queue[queue.length - 1] : dir;
    if (nx === -last.x && ny === -last.y) return;
    if (nx === last.x && ny === last.y) return;
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }

  // ---------- rysowanie ----------
  function drawFuel() {
    if (!food) return;
    var x = M + food.x * CELL + 2, y = M + food.y * CELL + 2, s = CELL - 4;
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    rr(ctx, x + 1, y + 2, s, s, 5); ctx.fill();
    ctx.fillStyle = food.color;
    rr(ctx, x, y, s, s, 5); ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    rr(ctx, x, y, s, s, 5); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 9px Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(food.label, x + s / 2, y + s / 2 + 0.5);
  }

  function drawSegment(i) {
    var s = snake[i];
    var cx = M + s.x * CELL + CELL / 2;
    var cy = M + s.y * CELL + CELL / 2;
    var fx, fy;
    if (i === 0) { fx = dir.x; fy = dir.y; }
    else { fx = snake[i - 1].x - s.x; fy = snake[i - 1].y - s.y; }
    // przejście przez ścianę (tryb CIENIAS) – kierunek zawsze o jedno pole
    if (fx > 1) fx = -1; else if (fx < -1) fx = 1;
    if (fy > 1) fy = -1; else if (fy < -1) fy = 1;
    if (fx === 0 && fy === 0) { fx = dir.x; fy = dir.y; }
    var C = CELL;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.atan2(fy, fx));

    // koła
    ctx.fillStyle = "#111";
    ctx.fillRect(-9, -C / 2 + 0.5, 7, 3);
    ctx.fillRect(-9, C / 2 - 3.5, 7, 3);
    ctx.fillRect(3, -C / 2 + 0.5, 7, 3);
    ctx.fillRect(3, C / 2 - 3.5, 7, 3);

    if (i === 0) {
      // kabina
      ctx.fillStyle = "#c62828";
      rr(ctx, -C / 2 + 1, -C / 2 + 3, C - 2, C - 6, 4); ctx.fill();
      ctx.strokeStyle = "#7f0000"; ctx.lineWidth = 1;
      rr(ctx, -C / 2 + 1, -C / 2 + 3, C - 2, C - 6, 4); ctx.stroke();
      // szyba
      ctx.fillStyle = "#b3e5fc";
      ctx.fillRect(C / 2 - 10, -C / 2 + 6, 5, C - 12);
      // światła
      ctx.fillStyle = "#fff59d";
      ctx.fillRect(C / 2 - 3, -C / 2 + 4, 2, 3);
      ctx.fillRect(C / 2 - 3, C / 2 - 7, 2, 3);
    } else {
      // zbiornik
      ctx.fillStyle = "#eceff1";
      rr(ctx, -C / 2 + 1, -C / 2 + 3, C - 2, C - 6, 6); ctx.fill();
      ctx.strokeStyle = "#90a4ae"; ctx.lineWidth = 1;
      rr(ctx, -C / 2 + 1, -C / 2 + 3, C - 2, C - 6, 6); ctx.stroke();
      // połysk
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.fillRect(-C / 2 + 5, -C / 2 + 5, C - 10, 2);
      // pas ostrzegawczy
      ctx.fillStyle = "#ef6c00";
      ctx.fillRect(-1.5, -C / 2 + 3.5, 3, C - 7);
    }
    ctx.restore();

    // ogólne godło na pierwszym zbiorniku (rysowane bez obrotu)
    if (i === 1) {
      ctx.fillStyle = "#d50000";
      circle(ctx, cx, cy, 6.5);
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.moveTo(cx, cy - 4);
      ctx.bezierCurveTo(cx + 4, cy, cx + 3, cy + 4, cx, cy + 4);
      ctx.bezierCurveTo(cx - 3, cy + 4, cx - 4, cy, cx, cy - 4);
      ctx.fill();
    }
  }

  function drawScene() {
    ctx.drawImage(bg, 0, 0);
    drawFuel();
    for (var i = snake.length - 1; i >= 0; i--) drawSegment(i);
  }

  function draw() {
    drawScene();
    if (state === "over") drawScorch();
    if (state !== "running" && state !== "crashing") overlay();
  }

  function overlay() {
    ctx.fillStyle = state === "over" ? "rgba(0,0,0,0.55)" : "rgba(0,0,0,0.65)";
    ctx.fillRect(M, M, N * CELL, N * CELL);
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";

    if (state === "over") {
      drawBoom(1);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px Arial, sans-serif";
      ctx.fillText("Wynik: " + score, SIZE / 2, SIZE / 2 + 30);
      ctx.font = "14px Arial, sans-serif";
      ctx.fillText("Spacja / dotknij = jeszcze raz", SIZE / 2, SIZE / 2 + 58);
      return;
    }

    ctx.fillStyle = "#fff";
    ctx.font = "900 32px Arial, sans-serif";
    ctx.fillText(state === "paused" ? "PAUZA" : "CYSTERKA", SIZE / 2, SIZE / 2 - 10);
    ctx.font = "14px Arial, sans-serif";
    ctx.fillText("Spacja / dotknij = start", SIZE / 2, SIZE / 2 + 20);
  }

  // ---------- sterowanie ----------
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    var map = {
      ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
      ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
      ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
      ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
    };
    if (map[k]) {
      e.preventDefault();
      if (state === "ready" || state === "paused") start();
      turn(map[k][0], map[k][1]);
    } else if (k === " " || k === "Enter") {
      e.preventDefault();
      if (state === "running") pause(); else start();
    }
  });

  var tx = 0, ty = 0;
  canvas.addEventListener("touchstart", function (e) {
    var t = e.changedTouches[0];
    tx = t.clientX; ty = t.clientY;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchend", function (e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
      if (state === "running") pause(); else start();
    } else {
      if (state === "ready" || state === "paused") start();
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
      else turn(0, dy > 0 ? 1 : -1);
    }
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("click", function () {
    if (state === "running") pause(); else start();
  });

  // ---------- wybór trybu ----------
  var btnC = document.getElementById("m-cienias");
  var btnP = document.getElementById("m-pro");

  function setMode(m) {
    mode = m;
    try { localStorage.setItem("cysterna-mode", m); } catch (e) {}
    btnC.classList.toggle("active", m === "cienias");
    btnP.classList.toggle("active", m === "pro");
    clearTimeout(timer);
    loadBest();
    reset();
  }
  btnC.addEventListener("click", function () { setMode("cienias"); this.blur(); });
  btnP.addEventListener("click", function () { setMode("pro"); this.blur(); });

  setMode(mode);
})();
</script>
</body>
</html>
